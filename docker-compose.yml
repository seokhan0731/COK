version: '3.8'

services:
  db:
    # ankane/pgvector, PostgreSQL 15.4
    image: ankane/pgvector@sha256:956744bd14e9cbdf639c61c2a2a7c7c2c48a9c8cdd42f7de4ac034f4e96b90f8
    container_name: cok-db
    restart: always
    # DB 접속을 위한 환경 설정(유저 이름, 비밀번호, DB 이름)
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # 포트 매핑
    ports:
      - "54321:5432"
    volumes:
      # 데이터 보존을 /pgdata-new
      - ./pgdata-new:/var/lib/postgresql/data
      # 컨테이너 기동시, /docker/initdb/ 내부 파일 이름순으로 실행
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro